version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cafe_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cafe
      POSTGRES_PASSWORD: cafe123
      POSTGRES_DB: cafedb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafe -d cafedb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cafe_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cafe_backend
    restart: unless-stopped
    # Internal port only (no external exposure)
    expose:
      - "3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://cafe:cafe123@postgres:5432/cafedb
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: https://paftacafe.seckingurlek.cloud
      FRONTEND_URL: https://paftacafe.seckingurlek.cloud
      ADMIN_PASSWORD: admin123
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./scripts:/scripts
      - /app/node_modules
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cafe_frontend
    restart: unless-stopped
    # Internal port only (no external exposure)
    expose:
      - "80"
    environment:
      VITE_API_URL: https://paftacafe.seckingurlek.cloud
      VITE_SOCKET_URL: https://paftacafe.seckingurlek.cloud
    depends_on:
      - backend

  # Reverse Proxy - Single entry point
  nginx:
    image: nginx:alpine
    container_name: cafe_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
